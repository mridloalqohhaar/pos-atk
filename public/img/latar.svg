<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e7bff"/>
      <stop offset="1" stop-color="#082a73"/>
    </linearGradient>
    <pattern id="tik" width="20" height="70" patternUnits="userSpaceOnUse">
      <line x1="10" y1="0" x2="10" y2="20" stroke="#0d47a1" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="220" cy="140" r="280" fill="#fff" opacity=".05"/>
  <circle cx="1480" cy="800" r="320" fill="#fff" opacity=".06"/>
  <circle cx="800" cy="450" r="200" fill="#fff" opacity=".03"/>

  <!-- Buku catatan -->
  <g transform="translate(1130 90) rotate(8)">
    <rect width="340" height="440" rx="18" fill="#ffc43d"/>
    <rect x="70" y="110" width="220" height="110" rx="10" fill="#fff"/>
    <rect x="90" y="135" width="130" height="14" rx="7" fill="#0d6efd"/>
    <rect x="90" y="165" width="170" height="10" rx="5" fill="#b9c8e6"/>
    <rect x="90" y="190" width="150" height="10" rx="5" fill="#b9c8e6"/>
    <g fill="#0a2f7a" stroke="#fff" stroke-width="4">
      <circle cx="0" cy="50" r="13"/>
      <circle cx="0" cy="110" r="13"/>
      <circle cx="0" cy="170" r="13"/>
      <circle cx="0" cy="230" r="13"/>
      <circle cx="0" cy="290" r="13"/>
      <circle cx="0" cy="350" r="13"/>
      <circle cx="0" cy="410" r="13"/>
    </g>
  </g>

  <!-- Pensil -->
  <g transform="translate(560 470) rotate(-18)">
    <rect x="0" width="40" height="44" rx="8" fill="#f8a5c2"/>
    <rect x="40" width="36" height="44" fill="#cfd8dc"/>
    <rect x="76" width="260" height="44" fill="#ffd43b"/>
    <rect x="76" y="14" width="260" height="6" fill="#f59f00" opacity=".6"/>
    <polygon points="336,0 336,44 412,22" fill="#f1c9a0"/>
    <polygon points="392,14 392,30 412,22" fill="#333"/>
  </g>

  <!-- Penggaris -->
  <g transform="translate(540 700) rotate(-4)">
    <rect width="420" height="70" rx="8" fill="#e8f1ff" opacity=".95"/>
    <rect width="420" height="70" rx="8" fill="url(#tik)"/>
  </g>

  <!-- Klip kertas -->
  <g transform="translate(1010 60) rotate(20)" fill="none" stroke="#cfd8dc" stroke-width="8" stroke-linecap="round">
    <path d="M40 20 v180 a30 30 0 0 0 60 0 v-200 a20 20 0 0 0 -40 0 v170"/>
  </g>

  <!-- Sticky note -->
  <g transform="translate(120 560) rotate(-8)">
    <rect width="210" height="210" rx="6" fill="#fff3a3"/>
    <rect x="28" y="44" width="150" height="10" rx="5" fill="#e0c64a"/>
    <rect x="28" y="76" width="120" height="10" rx="5" fill="#e0c64a"/>
    <rect x="28" y="108" width="140" height="10" rx="5" fill="#e0c64a"/>
  </g>

  <!-- Penghapus -->
  <g transform="translate(330 300) rotate(10)">
    <rect width="130" height="62" rx="12" fill="#fff"/>
    <rect x="70" width="60" height="62" rx="12" fill="#ff6b6b"/>
  </g>
</svg>